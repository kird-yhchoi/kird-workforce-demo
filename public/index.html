.archive-filters{display:grid;grid-template-columns:1.05fr 1.65fr 1.2fr auto auto;gap:10px;align-items:end;padding:17px 20px;border-bottom:1px solid #e5eaf1}
.archive-filters .field{min-width:0}
.archive-filters label{white-space:nowrap}
.archive-helper{padding:13px 21px;color:#6b8098;font-size:12px;border-bottom:1px solid #e9edf2}
.archive-month{white-space:nowrap;font-weight:750;color:#2d5c97}
.archive-review-row{display:grid;grid-template-columns:80px 62px 1fr;gap:12px;align-items:start;padding:10px 17px;border-bottom:1px solid #eef1f5;font-size:12px;color:#5c7087;line-height:1.6}
.archive-review-row strong{color:#9f5f20}
.archive-review-row:last-of-type{border-bottom:0}
.archive-period-list{padding:5px 17px 17px;display:grid;gap:3px}
.archive-period-row{background:none;border:0;text-align:left;display:grid;grid-template-columns:85px 54px 1fr;gap:12px;align-items:center;padding:10px 0;font-family:inherit;cursor:pointer;color:#3f5874}
.archive-period-row:hover{color:#1769a9}
.archive-period-row .bar-track{height:8px;background:#e8eef5;border-radius:8px;overflow:hidden}
.archive-period-row strong{font-size:12px;text-align:right}
.badge-warn{background:#fff1df;color:#ad6311}
.archive-person-title{font-size:22px;font-weight:850;color:#17304c;margin-bottom:6px}
.archive-person-title span{font-size:12px;color:#788eaa;font-weight:650}
.archive-person-sub{font-size:12px;color:#70829a}
.archive-state-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.archive-warning{background:#fff8ed;border:1px solid #f3ddbd;color:#955f26;padding:13px 14px;border-radius:10px;font-size:12px;line-height:1.65;margin:16px 0}
.archive-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.archive-field-grid>div{padding:12px;background:#f5f8fc;border-radius:10px}
.archive-field-grid label{font-size:11px;color:#8292a6;display:block;margin-bottom:7px}
.archive-field-grid strong{font-size:13px;color:#284763}
.archive-block-title{font-size:14px;font-weight:800;color:#17304c;margin:24px 0 12px;display:flex;gap:8px;align-items:center}
.archive-source{margin-top:23px;padding:14px;background:#f7f9fc;border-radius:10px;color:#6b7e93;font-size:12px;line-height:1.7}
.archive-source strong{color:#31506b}
.archive-source p{margin:7px 0 0}
.history-brief{margin-top:20px;padding-top:18px;border-top:1px solid #e7edf4}
.drawer-history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:#17304c;font-size:13px}
.archive-mini-list{display:grid;gap:6px;max-height:295px;overflow-y:auto}
.archive-mini{font-family:inherit;color:#47617d;display:flex;gap:11px;align-items:center;width:100%;padding:10px 11px;text-align:left;border:1px solid #e9eef5;background:#fff;border-radius:8px;cursor:pointer;font-size:12px}
.archive-mini:hover,.archive-mini.active{border-color:#90b2e1;background:#f2f7ff}
.archive-mini>svg{margin-left:auto;color:#899bb0;flex:none}
.archive-mini-period{font-weight:800;color:#28588b;white-space:nowrap}
.archive-mini-dept{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1100px){.archive-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-filters>button{max-width:100%}}
@media(max-width:630px){.archive-kpis{gap:9px}.archive-filters{grid-template-columns:1fr}.archive-review-row{grid-template-columns:70px 52px 1fr;gap:7px}.archive-field-grid{grid-template-columns:1fr}.archive-panel .table th,.archive-panel .table td{white-space:nowrap}}

/* Unified employee directory, collapsible dashboard charts, area-code locations. */
.stats-section{margin-bottom:20px}
.stats-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 15px}
.stats-heading-title{font-size:15px;color:#203a58;font-weight:820;letter-spacing:-.025em;margin:0}
.stats-heading-sub{font-size:11px;color:#8a9ab0;margin-top:5px}
.stats-toggle{flex:0 0 auto;background:#f0f5fc;color:#2c5b8d;border-color:#d6e4f4;padding:9px 12px}
.stats-toggle svg{transition:transform .16s ease;transform:rotate(180deg)}
.stats-toggle[aria-expanded="false"] svg{transform:rotate(0deg)}
.stats-content[hidden]{display:none!important}
.stats-content .dashboard-chart-pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.stats-content .dashboard-chart-pair>.card{height:100%}
.department-chart-block{margin-bottom:0}
.workplace-footnote{display:flex;align-items:center;gap:7px;font-size:11px;color:#788a9e;margin:-9px 0 20px;padding-left:4px;line-height:1.5}
.workplace-footnote svg{width:14px;height:14px;flex:0 0 14px;color:#8fa1b7}
.results-section{scroll-margin-top:18px}
.results-section .table-panel{border-top:3px solid #dfeafb}
@media(max-width:1160px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.stats-content .dashboard-chart-pair{grid-template-columns:1fr}}
@media(max-width:690px){.stats-heading-title{font-size:14px}.stats-heading-sub{font-size:10px}.stats-toggle{font-size:11px;padding-inline:9px}.workplace-footnote{font-size:10px}}

/* 2026-10-09: 6 KPI cards + three charts in one desktop row. */
.stats-content .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;margin-bottom:20px}
.stats-content .kpi-card{padding:16px 13px;min-height:119px}
.stats-content .kpi-heading{font-size:11px;padding-right:22px;white-space:normal;line-height:1.42}
.stats-content .kpi-value{font-size:26px}
.stats-content .kpi-unit{font-size:13px}
.stats-content .kpi-note{font-size:10px;line-height:1.55}
.stats-content .kpi-icon{width:31px;height:31px;right:11px;top:12px}
.stats-content .dashboard-chart-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:14px;margin-bottom:0}
.stats-content .dashboard-chart-triple>.card{min-width:0;height:100%;padding:17px 15px}
.stats-content .dashboard-chart-triple .card-head{gap:5px}
.stats-content .dashboard-chart-triple .card-desc{font-size:10px;line-height:1.5}
.stats-content .dashboard-chart-triple .card-title{font-size:13px}
.stats-content .dashboard-chart-triple .card-link{font-size:10px;white-space:nowrap}
.stats-content .dashboard-chart-triple .donut-layout{flex-direction:column;align-items:stretch;gap:12px}
.stats-content .dashboard-chart-triple .donut{margin:auto;width:142px;height:142px;flex:0 0 142px}
.stats-content .dashboard-chart-triple .donut-legend{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 9px}
.stats-content .dashboard-chart-triple .donut-line{min-width:0;gap:4px;font-size:10px}
.stats-content .dashboard-chart-triple .donut-line strong{font-size:10px}
.stats-content .dashboard-chart-triple .segment-switch{gap:5px}
.stats-content .dashboard-chart-triple .chip{font-size:10px;padding:5px 7px}
.stats-content .dashboard-chart-triple .grade-row{grid-template-columns:83px minmax(0,1fr) 31px;gap:6px;font-size:10px}
.stats-content .dashboard-chart-triple .grade-stats{gap:11px}
.stats-content .dashboard-chart-triple .chart-bars{gap:10px}
.stats-content .dashboard-chart-triple .bar-row{grid-template-columns:80px minmax(0,1fr) 28px;gap:6px}
.stats-content .dashboard-chart-triple .bar-label{font-size:10px}
.stats-content .dashboard-chart-triple .bar-val{font-size:10px}
.stats-content .dashboard-chart-triple .summary-foot{line-height:1.55}
@media(max-width:1250px){
 .stats-content .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .stats-content .dashboard-chart-triple{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats-content .dashboard-chart-triple>.card:last-child{grid-column:1/-1}
 .stats-content .dashboard-chart-triple .donut-layout{flex-direction:row}
}
@media(max-width:950px){
 .stats-content .dashboard-chart-triple{grid-template-columns:1fr}
 .stats-content .dashboard-chart-triple>.card:last-child{grid-column:auto}
}
@media(max-width:690px){
 .stats-content .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .stats-content .kpi-card{padding:14px 12px;min-height:105px}
 .stats-content .kpi-heading{font-size:10px}
 .stats-content .kpi-value{font-size:24px}
 .stats-content .dashboard-chart-triple .donut-layout{flex-direction:column}
}
/* Employee lookup: Search and reset actions share one row */
.search-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}
.search-actions>.btn{height:39px}
@media(max-width:690px){.search-actions{grid-column:1/-1}.search-actions>.btn{flex:1}}


/* 관리자 전용 명단 순서 관리 */
.admin-tabs{gap:8px;margin-bottom:18px;flex-wrap:wrap}
.admin-tabs .tab{display:inline-flex;align-items:center;gap:8px}
.admin-tabs .tab svg{width:15px;height:15px}
.order-management{max-width:1070px}
.order-toolbar{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;margin:18px 0 22px;align-items:end}
.order-sort-buttons{display:flex;gap:8px;flex-wrap:wrap}
.order-sort-buttons .btn{min-height:39px;font-size:12px}
.order-list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 3px 12px;gap:12px;border-top:1px solid #e9eef4}
.order-list-head strong{font-size:13px;color:#243f5c}
.order-list{display:grid;gap:7px;max-height:640px;overflow:auto;padding:2px 5px 2px 2px}
.order-item{background:#fff;border:1px solid #dde6ef;border-radius:10px;display:flex;align-items:center;gap:13px;padding:10px 13px;min-height:66px;box-shadow:0 1px 3px #132f4910;cursor:grab;transition:background .12s,border-color .12s}
.order-item:hover{background:#f8fbff;border-color:#adcae8}
.order-item:active{cursor:grabbing}
.order-item.dragging{opacity:.44;border-style:dashed}
.order-item.drop-target{background:#eaf3ff;border-color:#3e87d2;box-shadow:0 0 0 2px #94bdef66}
.order-drag{color:#95a8bc;font-size:20px;line-height:1;user-select:none;min-width:17px}
.order-index{color:#7a8da6;font-size:11px;font-weight:850;min-width:23px;font-variant-numeric:tabular-nums}
.order-person{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.order-person strong{font-size:13px;color:#273f58}
.order-person .order-position{font-size:10px;color:#376baa;border-radius:5px;padding:3px 7px;background:#ebf4ff;font-weight:750}
.order-grade{flex-basis:100%;font-size:11px;color:#7c8ca0;line-height:1.4}
.order-arrows{display:flex;align-items:center;gap:6px;flex:none}
.order-arrow{width:34px;min-width:34px;height:33px;padding:0;font-size:16px;font-weight:800}
.order-footer{border-top:1px solid #e9eef4;margin-top:16px;padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.order-footer .help-text{max-width:575px}
.order-footer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:800px){.order-toolbar{grid-template-columns:1fr}.order-footer{align-items:stretch;flex-direction:column}}
@media(max-width:520px){.order-item{gap:8px;padding:10px 8px}.order-arrows{gap:3px}.order-drag{font-size:16px}.order-arrow{width:28px;min-width:28px}.order-footer-actions .btn{flex:1}.order-list-head{align-items:start;flex-direction:column}}
@media print{.order-management,.admin-tabs{display:none!important}}

/* PDF printing: a fresh page for each division (with leadership together on page one). */
@page{size:A4 portrait;margin:14mm 13mm 15mm}
@media print {
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  .print-report{display:block!important;overflow:visible!important}
  .print-dept-section{display:block;break-inside:auto;page-break-inside:auto;}
  .print-dept-section + .print-dept-section{break-before:page!important;page-break-before:always!important;}
  .print-dept-section .print-dept{break-after:avoid-page;page-break-after:avoid;margin-top:0;padding-top:1mm;}
  .print-leadership{margin-top:6mm;}
  .print-leader-group{break-inside:avoid-page;page-break-inside:avoid;margin-bottom:5mm;}
  .print-leader-heading{font-size:11pt;line-height:1.5;margin:3mm 0 1mm;color:#34455a;border-bottom:1px solid #e0e4e8;}
  .print-person{break-inside:avoid-page;page-break-inside:avoid;overflow-wrap:anywhere;}
  .print-meta,.print-tasks{overflow-wrap:anywhere;word-break:break-word;}
}

/* Organizational PDF pagination: headquarters leads on the first division page. */
@page { size:A4 portrait; margin:11mm 12mm 12mm; }
@media print {
  html,body{margin:0!important;padding:0!important;background:#fff!important;font-size:9pt!important}
  .print-report{display:block!important;overflow:visible!important;width:100%!important;color:#182b41}
  .print-page{display:block!important;break-inside:auto;page-break-inside:auto}
  .print-page + .print-page{break-before:page!important;page-break-before:always!important}
  .print-page-header{border-bottom:1px solid #9faab8;padding:0 0 6pt;margin:0 0 7pt;break-after:avoid}
  .print-title{font-size:14pt!important;font-weight:800;letter-spacing:-.03em;line-height:1.22;margin:0 0 4pt!important;color:#1a3555}
  .print-subtitle{font-size:7.7pt!important;line-height:1.25!important;color:#687c92!important;margin:0!important}
  .print-page .print-dept-section{display:block!important;margin:0 0 7pt!important;break-inside:auto!important;page-break-inside:auto!important}
  .print-page .print-dept-section + .print-dept-section{break-before:auto!important;page-break-before:auto!important}
  .print-page .print-dept{font-size:11pt!important;line-height:1.35!important;font-weight:800;
    color:#1b3556;border:0!important;border-left:3px solid #436a95!important;background:#eff4fa;
    padding:4pt 7pt!important;margin:2pt 0 2pt!important;break-after:avoid!important;page-break-after:avoid!important}
  .print-dept-count{font-size:8pt;color:#5b6f86;font-weight:600;margin-left:6pt}
  .print-page .print-person{display:grid!important;grid-template-columns:39% minmax(0,1fr)!important;gap:7pt!important;
    border-bottom:1px solid #e1e6ed!important;break-inside:avoid-page!important;page-break-inside:avoid!important;
    padding:5.7pt 3pt!important;margin:0!important;line-height:1.28!important;box-sizing:border-box;
    overflow-wrap:anywhere;word-break:keep-all}
  .print-person:last-child{border-bottom:0!important}
  .print-person-identity,.print-tasks{min-width:0!important;overflow-wrap:anywhere!important}
  .print-person-name{font-size:9.4pt!important;line-height:1.34!important;color:#1d344f;display:flex;gap:6pt;align-items:baseline;flex-wrap:wrap}
  .print-person-name strong{font-size:10pt!important;font-weight:800;white-space:nowrap}
  .print-person-name span{font-size:8.7pt;color:#51677d}
  .print-page .print-meta{font-size:7.7pt!important;line-height:1.37!important;color:#697d90;word-break:break-all}
  .print-status{font-size:7.2pt;color:#98551d;margin-top:1pt}
  .print-page .print-tasks{font-size:9.1pt!important;line-height:1.38!important;color:#2c3c4f!important;word-break:keep-all!important}
  .print-contact-sep{white-space:nowrap}
}

/* 관리자 신규 직원 등록 */
.admin-create-card{max-width:1000px}
.required-mark{color:#cf4654;font-weight:900}
.checkbox-row{display:flex;align-items:center;gap:9px;min-height:39px;padding:10px 12px;border:1px solid #dae3ed;border-radius:8px;background:#f8fafc;color:#394f68;font-size:12px;cursor:pointer}
.checkbox-row input{width:16px;height:16px;accent-color:#1f5fb7}
.create-guidance{display:flex;align-items:flex-start;gap:9px;padding:12px;border-radius:10px;background:#eef6ff;color:#40678e;font-size:11px;line-height:1.7}
.create-guidance svg{flex:0 0 17px;width:17px;height:17px;margin-top:1px}
.create-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:2px}
@media(max-width:690px){.create-actions .btn{flex:1}.admin-create-card .card-head{align-items:flex-start;flex-wrap:wrap}}

/* Employee changes audit trail (2026-10): separate from document-month history. */
.person-edited-at{font-size:11px;color:#51667f;white-space:nowrap}
.admin-modified{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid #e0e9f3;padding-top:11px;margin-top:12px;font-size:11px;color:#54718f}
.admin-modified strong{color:#334e69}
.revision-panel{max-width:100%;}
.revision-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:15px 0}
.revision-toolbar .field{flex:1 1 270px;min-width:220px}
.revision-toolbar>.btn{margin-bottom:1px}
.revision-note{padding:10px 12px;margin-bottom:12px;background:#f7faff;border:1px solid #e4edf7;border-radius:8px}
.revision-list{display:grid;gap:9px}
.revision-event{border:1px solid #e1e9f2;border-radius:11px;background:#fff;overflow:hidden}

.revision-event>summary:hover{background:#f7faff}
.revision-event>summary::-webkit-details-marker{display:none}
.revision-event-date{color:#58718c;font-size:11px;white-space:nowrap;min-width:145px}
.revision-event-person{font-size:12px;font-weight:790}
.revision-event-actor{font-size:11px;color:#7890a9}
.revision-event-count{margin-left:auto;color:#72869c;font-size:11px}
.revision-event-body{padding:0 15px 14px;border-top:1px solid #eaf0f6}
.revision-diffs{padding:2px 0}
.revision-diff{display:grid;grid-template-columns:155px minmax(0,1fr);gap:11px;padding:13px 0;border-bottom:1px solid #ecf1f6}
.revision-field{font-size:12px;font-weight:750;color:#385572}
.revision-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.revision-values>div+div{background:#eef8f5}

.revision-snapshots pre{margin:0;padding:11px;max-height:270px;overflow:auto;background:#15283f;color:#d7e9ff;font:11px/1.65 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
@media(max-width:800px){.revision-diff{grid-template-columns:1fr;gap:5px}.revision-event-date{min-width:0}.revision-values{grid-template-columns:1fr}}
@media print{.revision-panel,.person-edited-at{display:none!important}}

.user-tools [data-logout]{white-space:nowrap}
